name: Memphis Dust build

on:
  push:
    paths:
      - "memphis-dust/**"
      - ".github/workflows/memphis-dust-windows.yml"
  pull_request:
    paths:
      - "memphis-dust/**"
      - ".github/workflows/memphis-dust-windows.yml"
  workflow_dispatch:

env:
  PLUGINVAL_TAG: v1.0.4

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: memphis-dust

    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64)
        run: |
          cmake --version
          cmake -B build -A x64

      - name: Build plugin, standalone and tests (Release)
        run: cmake --build build --config Release --parallel

      - name: DSP unit tests
        run: ./build/Release/dsp_tests.exe

      - name: Host test (loads the built VST3, runs every preset)
        run: |
          $exe = Get-ChildItem -Recurse build -Filter memphis_dust_host_test.exe | Select-Object -First 1
          & $exe.FullName "build/MemphisDust_artefacts/Release/VST3/Memphis Dust.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows x64 VST3
        uses: actions/upload-artifact@v4
        with:
          name: MemphisDust-VST3-Windows-x64
          path: memphis-dust/build/MemphisDust_artefacts/Release/VST3

      - name: PluginVal (strictness 5)
        run: |
          $vst3 = "build/MemphisDust_artefacts/Release/VST3/Memphis Dust.vst3"
          if (-not (Test-Path $vst3)) { throw "VST3 not found: $vst3" }
          $zip = "$env:RUNNER_TEMP\pluginval.zip"
          $bin = "$env:RUNNER_TEMP\pluginval-bin"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_TAG/pluginval_Windows.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $bin -Force
          $pluginval = Get-ChildItem -Path $bin -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $pluginval.FullName --validate-in-process --strictness-level 5 --output-dir "$env:RUNNER_TEMP\pluginval-out" $vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip (release bundle)
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(MemphisDust VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $out = "dist/MemphisDust-$ver-Windows"
          New-Item -ItemType Directory -Force -Path "$out/VST3", "$out/Standalone" | Out-Null
          Copy-Item -Recurse "build/MemphisDust_artefacts/Release/VST3/Memphis Dust.vst3" "$out/VST3/"
          Copy-Item "build/MemphisDust_artefacts/Release/Standalone/Memphis Dust.exe" "$out/Standalone/"
          Copy-Item README.md, docs/INSTALL-WINDOWS.txt "$out/"
          Compress-Archive -Path "$out/*" -DestinationPath "dist/MemphisDust-$ver-Windows.zip" -Force

      - name: Build installer (Inno Setup)
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(MemphisDust VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$ver" packaging/MemphisDust.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: MemphisDust-Windows-x64-release
          path: |
            memphis-dust/dist/*.zip
            memphis-dust/dist/*Setup.exe
          if-no-files-found: error

  linux-pluginval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memphis-dust
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libcurl4-openssl-dev ladspa-sdk xvfb

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4

      - name: DSP unit tests
        run: ./build/dsp_tests

      - name: Build pluginval
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch "$PLUGINVAL_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/Tracktion/pluginval.git /tmp/pluginval
          cmake -S /tmp/pluginval -B /tmp/pluginval/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build /tmp/pluginval/build -j 4

      - name: PluginVal (strictness 5)
        run: |
          VST3=$(find build/MemphisDust_artefacts/Release/VST3 -maxdepth 1 -name '*.vst3' | head -1)
          test -n "$VST3"
          xvfb-run -a /tmp/pluginval/build/pluginval_artefacts/Release/pluginval \
            --validate-in-process --strictness-level 5 --output-dir /tmp/pluginval-out "$VST3"