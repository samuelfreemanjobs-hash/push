name: Memphis Dust - Windows build

on:
  push:
    paths:
      - "memphis-dust/**"
      - ".github/workflows/memphis-dust-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: memphis-dust

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin, standalone and tests (Release)
        run: cmake --build build --config Release --parallel

      - name: DSP unit tests
        run: ./build/Release/dsp_tests.exe

      - name: Host test (loads the built VST3, runs every preset)
        run: |
          $exe = Get-ChildItem -Recurse build -Filter memphis_dust_host_test.exe | Select-Object -First 1
          & $exe.FullName "build/MemphisDust_artefacts/Release/VST3/Memphis Dust.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(MemphisDust VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          $out = "dist/MemphisDust-$ver-Windows"
          New-Item -ItemType Directory -Force -Path "$out/VST3", "$out/Standalone" | Out-Null
          Copy-Item -Recurse "build/MemphisDust_artefacts/Release/VST3/Memphis Dust.vst3" "$out/VST3/"
          Copy-Item "build/MemphisDust_artefacts/Release/Standalone/Memphis Dust.exe" "$out/Standalone/"
          Copy-Item README.md, docs/INSTALL-WINDOWS.txt "$out/"
          Compress-Archive -Path "$out/*" -DestinationPath "dist/MemphisDust-$ver-Windows.zip" -Force

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=$env:APP_VERSION packaging/MemphisDust.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: MemphisDust-Windows-x64
          path: |
            memphis-dust/dist/*.zip
            memphis-dust/dist/*Setup.exe
          if-no-files-found: error
