name: KitForge build

on:
  push:
    paths: [ "drum-machine/**", ".github/workflows/kitforge.yml" ]
  pull_request:
    paths: [ "drum-machine/**", ".github/workflows/kitforge.yml" ]
  workflow_dispatch:

env:
  PLUGINVAL_TAG: v1.0.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: drum-machine
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libcurl4-openssl-dev ladspa-sdk xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run render test
        shell: bash
        run: |
          exe=$(find build/KitForgeRenderTest_artefacts -type f \( -name KitForgeRenderTest -o -name KitForgeRenderTest.exe \) | head -1)
          "$exe" renders

      - name: Generate factory sample packs
        if: runner.os == 'Linux'
        run: ./build/KitForgeFactory_artefacts/Release/KitForgeFactory --factory --out packs

      - name: Upload sample packs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: KitForge-Factory-Sample-Packs
          path: drum-machine/packs

      - name: Upload Windows x64 VST3
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KitForge-VST3-Windows-x64
          path: drum-machine/build/KitForge_artefacts/Release/VST3

      - name: Upload plugin (macOS / Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KitForge-${{ runner.os }}
          path: |
            drum-machine/build/KitForge_artefacts/Release/VST3
            drum-machine/build/KitForge_artefacts/Release/Standalone

      - name: Build pluginval
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch "$PLUGINVAL_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/Tracktion/pluginval.git /tmp/pluginval
          cmake -S /tmp/pluginval -B /tmp/pluginval/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build /tmp/pluginval/build -j 4

      - name: PluginVal (strictness 5, Linux)
        if: runner.os == 'Linux'
        working-directory: drum-machine
        run: |
          VST3=$(find build/KitForge_artefacts/Release/VST3 -maxdepth 1 -name '*.vst3' | head -1)
          test -n "$VST3"
          PLUGINVAL=/tmp/pluginval/build/pluginval_artefacts/Release/pluginval
          xvfb-run -a "$PLUGINVAL" \
            --validate-in-process --strictness-level 5 --output-dir /tmp/pluginval-out "$VST3"

      - name: PluginVal (strictness 5, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: drum-machine
        run: |
          $vst3 = Get-ChildItem build/KitForge_artefacts/Release/VST3 -Filter *.vst3 | Select-Object -First 1
          if (-not $vst3) { throw "KitForge VST3 bundle not found" }
          $zip = "$env:RUNNER_TEMP\pluginval.zip"
          $bin = "$env:RUNNER_TEMP\pluginval-bin"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_TAG/pluginval_Windows.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $bin -Force
          $pluginval = Get-ChildItem -Path $bin -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $pluginval.FullName --validate-in-process --strictness-level 5 --output-dir "$env:RUNNER_TEMP\pluginval-out" $vst3.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }